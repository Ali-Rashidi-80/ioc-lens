name: CI

on:
  push:
    branches:
      - main
      - master
      - 'fix/**'
      - 'feat/**'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify-and-test:
    name: Shared Multiplatform Unit & Logic Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run Multiplatform Tests
        run: ./gradlew check --no-daemon --stacktrace

      - name: Publish Test Results Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-linux
          path: |
            **/build/reports/tests/
            **/build/test-results/
          if-no-files-found: ignore

  build-desktop:
    name: Verify Desktop App Build
    runs-on: ubuntu-latest
    needs: verify-and-test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Compile Desktop App
        run: ./gradlew :desktopApp:compileKotlin --no-daemon --stacktrace

  build-android:
    name: Verify Android App Build
    runs-on: ubuntu-latest
    needs: verify-and-test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Set up Android SDK platform and licenses
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager --channel=3 "platforms;android-37.0" "build-tools;37.0.0" || true
          if [ -d "$ANDROID_HOME/platforms/android-37.0" ] && [ ! -d "$ANDROID_HOME/platforms/android-37" ]; then
            cp -r "$ANDROID_HOME/platforms/android-37.0" "$ANDROID_HOME/platforms/android-37" || true
          fi
        shell: bash

      - name: Compile Android Debug APK
        run: ./gradlew :androidApp:assembleDebug --no-daemon --stacktrace

  build-ios-darwin:
    name: Verify Apple Targets (iOS / macOS)
    runs-on: macos-latest
    needs: verify-and-test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Compile Shared iOS Targets
        run: ./gradlew :shared:compileKotlinIosArm64 :shared:compileKotlinIosSimulatorArm64 --no-daemon --stacktrace
