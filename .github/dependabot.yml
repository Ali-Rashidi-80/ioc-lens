version: 2
updates:
  # Group all GitHub Actions updates into a single monthly PR
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    groups:
      all-actions:
        patterns: ["*"]
    open-pull-requests-limit: 1

  # Group all Gradle dependency updates into a single monthly PR to prevent bot PR spam
  - package-ecosystem: "gradle"
    directory: "/"
    schedule:
      interval: "monthly"
    groups:
      all-dependencies:
        patterns: ["*"]
    open-pull-requests-limit: 1
