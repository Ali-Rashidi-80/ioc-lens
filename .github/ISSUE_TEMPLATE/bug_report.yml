name: 🐛 Bug Report
description: Create a report to help us improve IOC Lens
title: "[BUG]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting an issue! Please provide as much context as possible.
        **Note:** Do NOT paste sensitive private indicators, credentials, or API keys.
  - type: dropdown
    id: platform
    attributes:
      label: Operating System / Platform
      description: Which platform did this issue occur on?
      options:
        - Windows 10/11 (.msi)
        - macOS (.dmg)
        - Linux (Ubuntu/Debian .deb)
        - Android (APK)
        - iOS
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: IOC Lens Version
      description: What version of IOC Lens are you using? (e.g., v0.1.0)
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: Clear and concise description of what the bug is.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: How can we reproduce this behavior?
      placeholder: |
        1. Open IOC Lens
        2. Input indicator 'hxxps://example[.]com'
        3. Click Analyze
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Terminal / Log Output
      description: Paste any error messages or stacktraces (ensure no secrets are included).
      render: shell
